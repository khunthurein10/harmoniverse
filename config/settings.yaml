# Pipeline settings read by the scripts (pipeline/harmonizer/config.py).
# Only values the code actually reads are listed here. Fixed method rules (cleaning filters, conversion,
# filling, uncertainty) live in the code next to their source; see pipeline/README.md.

grid:
  cell_deg: 0.25            # box size in degrees (GFED5NRT, MRBA60 use 0.25)
  date_basis: utc           # FIRMS dates are UTC; "local_solar" is also supported but not used

cleaning:                   # VIIRS static source mask (02_grid.py)
  static_mask_cell_deg: 0.01      # mask cell size
  static_mask_min_detections: 6   # rule 1, GFED5NRT Sect. 2.3.2: "more than five" non-vegetation detections
  static_mask_persistence: true   # rule 2 on/off (our choice)
  static_mask_min_days: 16        # rule 2: hot on 16+ days a year (MODIS C6 User Guide, Table 10) ...
  static_mask_min_months: 7       # ... and in 7+ months (our choice)
  static_mask_long_run: true      # rule 2b on/off (our choice)
  static_mask_long_run_days: 60   # rule 2b: hot on 60+ days a year (our choice)

viewing_angle:
  modis_max_scan_angle_deg: 30    # marks MODIS centre pixels (MRBA60); used for E6, not for the final record

paths:                      # relative to the project root
  raw: data/raw
  ancillary: data/ancillary
  clean: data/interim/clean
  grid: data/interim/grid
  processed: data/processed
